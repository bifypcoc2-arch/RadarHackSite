name: Build native launcher

on:
  workflow_dispatch:
  push:
    paths:
      - "launcher-native/**"
      - ".github/workflows/build-launcher.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Publish single-file launcher
        run: dotnet publish launcher-native/Foresight.Launcher.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o artifacts/launcher
      - uses: actions/upload-artifact@v4
        with:
          name: Foresight-Launcher-win-x64
          path: artifacts/launcher/**
          if-no-files-found: error
