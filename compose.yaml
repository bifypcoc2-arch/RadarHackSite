services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_RADAR_WS_URL: ${NEXT_PUBLIC_RADAR_WS_URL}
    env_file:
      - .env.production
    environment:
      DATABASE_URL: file:/data/foresight.db
      NODE_ENV: production
    volumes:
      - ./storage:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 40s

  realtime:
    build:
      context: ./realtime
      dockerfile: Dockerfile
    environment:
      WS_HOST: 0.0.0.0
      WS_PORT: 22006
      RADAR_INGEST_SECRET: ${RADAR_INGEST_SECRET}
      FORESIGHT_APP_URL: http://web:3000
      ALLOWED_ORIGINS: ${NEXT_PUBLIC_APP_URL}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2.10-alpine
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      realtime:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
